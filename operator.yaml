# The operator as the analytics stack registers it (§5.14).
#
# ODE offers registration as an explicit action and never performs it on its own,
# so this file is the payload that action sends. Edit it here; it is the source of
# truth for what the pipeline editor will show.
name: ode-ablation-nilm-l1-haiku
description: An ODE-developed analytics operator
image: ghcr.io/senergy-platform/ode-ablation-nilm-l1-haiku:latest

# Public makes the operator visible to other users of the platform. Registration
# is a developer decision and so is this.
pub: false
deploymentType: local

# What the pipeline editor offers as inputs. Each "name" has to match a mapping
# destination in op.py's selectors, and the two together are how a message reaches
# infer(). The compressor's sub-meter is deliberately not an input: it is trained
# against, and never received at runtime.
inputs:
  - name: main_kwh
    type: float
  - name: heat_w
    type: float
  - name: ev_w
    type: float

# What the operator emits. These are the keys of the dictionary infer() returns.
outputs:
  - name: prediction
    type: float

# Deployment configuration, matching CustomConfig in op.py.
config_values:
  - name: retrain_after_s
    type: int
